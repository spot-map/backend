services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ridemap-api
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ridemap
      DB_USERNAME: ridemap
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-spot-images}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    networks:
      - ridemap-network

  postgres:
    image: imresamu/postgis:17-3.5-bookworm
    container_name: ridemap-postgres
    restart: unless-stopped
    platform: linux/amd64
    environment:
      POSTGRES_DB: ridemap
      POSTGRES_USER: ridemap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - ridemap_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridemap -d ridemap"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ridemap-network

  redis:
    image: redis:8.2-alpine
    container_name: ridemap-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ridemap_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ridemap-network

  rustfs:
    image: rustfs/rustfs:latest
    container_name: ridemap-rustfs
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - rustfs_data:/data
    command:
      - /data
    networks:
      - ridemap-network

volumes:
  ridemap_postgres_data:
  ridemap_redis_data:
  rustfs_data:

networks:
  ridemap-network:
    driver: bridge